[package]
name = "maestro-api"
version = "0.1.0"
edition = "2021"
description = "Single API schema for the Maestro audio engine: Command / Event / Snapshot / Config (spec §3.6). Serde types with ts-rs codegen — UniFFI and WASM transports both speak exactly this schema."
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = { version = "10", features = ["serde-compat"] }

[[bin]]
name = "gen-ts"
path = "src/bin/gen_ts.rs"
