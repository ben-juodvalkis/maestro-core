[package]
name = "maestro-validate"
version = "0.1.0"
edition = "2021"
publish = false
description = "Device-capture analyzer for the native audio rebuild (spec §6.4): click-onset cross-stem sync analysis + render-budget gates over harness captures"

[dependencies]
maestro-core = { path = "../maestro-core", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
