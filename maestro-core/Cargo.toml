[package]
name = "maestro-core"
version = "0.1.0"
edition = "2021"
description = "Shared Rust audio engine for Maestro — compiles to native (.dylib/.so) and WASM"
license = "MIT"

[lib]
name = "maestro_core"
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
# Signalsmith Stretch — the C++ time-stretcher (colinmarc's crate: bindgen +
# cc). Patched to the vendored fork (workspace [patch.crates-io]) which also
# compiles the SAME C++ for wasm32 targets via wasi-sdk (M4, spec §3.8).
signalsmith-stretch = { version = "0.1", optional = true }

# UniFFI — the native six-function transport (spec §3.6). Native targets only.
uniffi = { version = "0.31", optional = true }

# Lock-free SPSC queues for the RT command/event/reclaim paths (spec §3.3).
rtrb = "0.3"

# The one API schema (spec §3.6): Command / Event / Snapshot / Config.
maestro-api = { path = "../maestro-api" }

# WASM exports via wasm-bindgen — the six-function transport (spec §3.6, M4).
# Feature-gated: only compiled for wasm32 targets.
wasm-bindgen = { version = "0.2", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
# (js-sys removed at M4 — the six-function transport needs no direct JS API.)
serde_json = { version = "1", optional = true }


[dev-dependencies]
# Exact rational reference implementation for T-INV (spec §6.2) — test-only,
# never linked into the shipped engine.
num-bigint = "0.4"
# Proves the render loop performs zero heap allocation (spec §3.3 RT rules).
assert_no_alloc = "1"
# Harness-shaped report JSON for the offline analyzer smoke (spec §6.4).
serde_json = "1"
# Real AAC/M4A decode for T-LOAD (spec §3.4#3: tests/CLI use symphonia) — the
# §6.5 fixtures are decoded by a third decoder so reconciliation is proven
# decoder-agnostic, not tuned to AVAudioFile or ffmpeg.
symphonia = { version = "0.5", default-features = false, features = ["aac", "isomp4"] }

[features]
default = ["native-stretch"]
# The Signalsmith C++ stretcher — despite the name it builds for native AND
# wasm32 targets (the vendored crate compiles the same C++ via wasi-sdk; M4,
# spec §3.8). The engine planes (audio_core/control_plane) require it.
native-stretch = ["signalsmith-stretch"]
json = ["serde", "serde_json"]            # JSON serialization for complex types
# The six-function wasm transport (spec §3.6, M4) for the AudioWorklet module.
wasm = ["wasm-bindgen", "json", "native-stretch"]
uniffi-bindings = ["uniffi", "json", "native-stretch"] # native transport (spec §3.6)
# Sabotage modes for T-INV negative controls (spec §6.2): float_cursor,
# pcm_length_loop, timer_clock. CI builds with this feature and asserts the
# invariant suite DETECTS each mode (the suite is broken if a sabotage passes).
# Never enabled in shipping builds.
drift-injection = []
