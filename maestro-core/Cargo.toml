[package]
name = "maestro-core"
version = "0.1.0"
edition = "2021"
description = "Shared Rust audio engine for Maestro — compiles to native (.dylib/.so) and WASM"
license = "MIT"

[lib]
name = "maestro_core"
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
# Step 8: Signalsmith Stretch — native C++ time-stretching and pitch-shifting
# Feature-gated: only compiled for native targets (not WASM — web uses existing JS/WASM pipeline)
# Uses colinmarc's crate: bindgen + cc compiles the C++ header-only library
signalsmith-stretch = { version = "0.1", optional = true }

# Step 9: WASM exports via wasm-bindgen
# Feature-gated: only compiled for wasm32 targets
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

# Future steps will add:
# symphonia = { version = "0.5", features = ["all-codecs", "all-formats"] }  # audio decoding
# uniffi = { version = "0.28", features = ["cli"] }                          # Swift/Kotlin bindings

[dev-dependencies]
# No external test deps needed yet — std assertions suffice

[features]
default = ["native-stretch"]
native-stretch = ["signalsmith-stretch"]  # Step 8: native C++ time-stretching
wasm = ["wasm-bindgen", "js-sys", "serde", "serde_json"]  # Step 9: wasm-bindgen exports

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
