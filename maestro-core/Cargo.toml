[package]
name = "maestro-core"
version = "0.1.0"
edition = "2021"
description = "Shared Rust audio engine for Maestro — compiles to native (.dylib/.so) and WASM"
license = "MIT"

[lib]
name = "maestro_core"
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
# Phase 1 — no external deps for pure-math modules (timing, beat_timeline)
# Future steps will add:
# symphonia = { version = "0.5", features = ["all-codecs", "all-formats"] }  # Step 5: audio decoding
# uniffi = { version = "0.28", features = ["cli"] }                          # Step 7: Swift/Kotlin bindings
# wasm-bindgen = "0.2"                                                       # Step 9: WASM exports

[dev-dependencies]
# No external test deps needed yet — std assertions suffice

[features]
default = []
wasm = []  # Future: wasm-bindgen exports

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
