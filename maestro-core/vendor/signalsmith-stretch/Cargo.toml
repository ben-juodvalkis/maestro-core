# Vendored from crates.io signalsmith-stretch 0.1.3 (colinmarc, MIT) for the
# native audio rebuild M4 (spec §3.8): the SAME C++ (signalsmith-stretch.h,
# byte-identical to the registry copy) must compile INTO the maestro-core WASM
# module, which the upstream build.rs cannot do. This fork adds wasm32 support
# to build.rs (wasi-sdk clang++ + runtime shims, see src/wasm_shims.cpp) and
# changes nothing else. Wired in via [patch.crates-io] in the workspace
# Cargo.toml.
#
# Vendor provenance: registry checksum
# 51dae6f10b5532510f65c309c4d868babe3aecf6ce0782678081338311f176fd
# (examples/ and dev-dependencies dropped; C++ sources untouched).

[package]
edition = "2021"
name = "signalsmith-stretch"
version = "0.1.3"
authors = ["Colin Marc <hi@colinmarc.com>"]
build = "build.rs"
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "A wrapper for the Signalsmith Stretch timestretch and pitch-shifting algorithm (vendored, +wasm32)"
homepage = "https://github.com/colinmarc/signalsmith-stretch-rs"
documentation = "https://docs.rs/signalsmith-stretch"
readme = "README.md"
license = "MIT"
repository = "https://github.com/colinmarc/signalsmith-stretch-rs"

[lib]
name = "signalsmith_stretch"
path = "src/lib.rs"

[dependencies.dasp]
version = "0.11"

[build-dependencies.bindgen]
version = "0.70"

[build-dependencies.cc]
version = "1"
